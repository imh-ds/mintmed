name: Mintmed verification

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:
    inputs:
      run_pilot:
        description: "Run the Task 14 runtime pilot after the test suite"
        required: true
        type: boolean
        default: false
      pilot_repeats:
        description: "Measured repeats for the optional runtime pilot"
        required: true
        type: string
        default: "2"
      pilot_config:
        description: "Validation config whose cells the pilot measures"
        required: false
        type: string
        default: "configs/mediation_validation.yaml"
      pilot_cells:
        description: "Cells to pilot, space- or comma-separated (empty: every configured cell)"
        required: false
        type: string
        default: ""
      pilot_datasets_per_cell:
        description: "Datasets per cell for the forecast (empty: the config's replicates)"
        required: false
        type: string
        default: ""
      pilot_replicate_blocks:
        description: "Replicate blocks per cell for the shard forecast"
        required: false
        type: string
        default: "4"

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  NUMEXPR_NUM_THREADS: "2"

jobs:
  tests:
    name: Python 3.11 test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run full test suite
        run: python -m pytest -q

  r-comparators-env:
    # Task 17: install the pinned R comparator packages from the dated PPM
    # snapshot in benchmarks/comparators/r/pins.R and record their versions.
    # Independent of the Python jobs; nothing else depends on it. The cache
    # path and key match sharded_benchmark.yml's with_r steps, so a push to a
    # branch warms the library that a later dispatch's shards restore. Any
    # change to the pins or install script changes the key and forces a fresh
    # install from the snapshot.
    name: R comparator environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"
          use-public-rspm: true
      - id: r-env
        name: Locate comparator R library
        run: |
          echo "codename=$(. /etc/os-release && echo "$VERSION_CODENAME")" >> "$GITHUB_OUTPUT"
          echo "R_COMPARATOR_LIB=$RUNNER_TEMP/r-comparator-lib" >> "$GITHUB_ENV"
          echo "R_LIBS=$RUNNER_TEMP/r-comparator-lib" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/r-comparator-lib
          key: r-comparator-lib-${{ runner.os }}-${{ steps.r-env.outputs.codename }}-r4.6-${{ hashFiles('benchmarks/comparators/r/install_packages.R', 'benchmarks/comparators/r/pins.R') }}
      - name: Install pinned R comparator packages
        run: Rscript benchmarks/comparators/r/install_packages.R
      - name: Record R comparator versions
        run: Rscript benchmarks/comparators/r/versions.R

  cli-and-validation:
    name: CLI examples and validation smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run single mediation example
        run: >
          python -m mintmed.cli
          --data examples/single/data.csv
          --spec examples/single/analysis.yaml
          --output results/generated/example-single
      - name: Run parallel mediation example
        run: >
          python -m mintmed.cli
          --data examples/parallel/data.csv
          --spec examples/parallel/analysis.yaml
          --output results/generated/example-parallel
      - name: Run moderated serial mediation example
        run: >
          python -m mintmed.cli
          --data examples/serial_moderated/data.csv
          --spec examples/serial_moderated/analysis.yaml
          --output results/generated/example-serial-moderated
      - name: Check example outputs
        run: >
          python scripts/check_example_outputs.py
          results/generated/example-single
          results/generated/example-parallel
          results/generated/example-serial-moderated
      - name: Run validation smoke configuration
        run: >
          python -m mintmed.experiments.mediation_validation
          --config configs/mediation_validation_smoke.yaml
          --output results/generated/validation-smoke
      - name: Upload CLI and validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cli-validation-${{ github.run_id }}
          path: results/generated/
          if-no-files-found: warn
          retention-days: 14

  runtime-pilot:
    name: Task 14 runtime pilot
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.run_pilot == true)
      || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'pilot:')) }}
    runs-on: ubuntu-latest
    # Two repeats of five complete bootstrap cases exceed the old 45-minute
    # envelope even when all cases are healthy. Keep the runtime guard finite,
    # but allow the locked pilot to finish and emit its evidence artifact.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run runtime pilot
        # Inputs are empty on the `pilot:` push trigger, so every value falls
        # back to the run-1 defaults. They reach the shell only through
        # environment variables and are always quoted.
        env:
          PILOT_REPEATS: ${{ inputs.pilot_repeats || '2' }}
          PILOT_CONFIG: ${{ inputs.pilot_config || 'configs/mediation_validation.yaml' }}
          PILOT_CELLS: ${{ inputs.pilot_cells || '' }}
          PILOT_DATASETS_PER_CELL: ${{ inputs.pilot_datasets_per_cell || '' }}
          PILOT_REPLICATE_BLOCKS: ${{ inputs.pilot_replicate_blocks || '4' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repeats "$PILOT_REPEATS"
            --config "$PILOT_CONFIG"
            --replicate-blocks "$PILOT_REPLICATE_BLOCKS"
            --output results/generated/runtime-pilot.json
            --markdown results/generated/runtime-pilot.md
          )
          if [ -n "$PILOT_DATASETS_PER_CELL" ]; then
            args+=(--datasets-per-cell "$PILOT_DATASETS_PER_CELL")
          fi
          IFS=$', \t\n' read -r -a cells <<< "$PILOT_CELLS" || true
          for cell in "${cells[@]}"; do
            if [ -n "$cell" ]; then
              args+=(--pilot-cell "$cell")
            fi
          done
          echo "run_runtime_pilot.py ${args[*]}"
          python scripts/run_runtime_pilot.py "${args[@]}"
      - name: Upload runtime-pilot evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-pilot-${{ github.run_id }}
          path: results/generated/
          if-no-files-found: warn
          retention-days: 14
