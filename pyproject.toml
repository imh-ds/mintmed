[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mintmed"
version = "0.1.0"
description = "Mediation with information-aware nonlinear terms"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "patsy>=1.0,<2",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-xdist>=3.8"]

[project.scripts]
mintmed = "mintmed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
