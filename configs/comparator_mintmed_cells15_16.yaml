# Task 17 Stage 1: Mintmed's own run of the two new larger-N mixed-null
# cells (T17-S8). Same master seed, replicate count and analysis settings as
# configs/mediation_validation_v3.yaml, restricted to cells 15 and 16, so the
# datasets and analysis seeds are exactly those of v3 (seeds depend only on the
# master seed, the cell ordinal and the replicate). Cells 01-14 reuse run 2
# (GitHub run 36349731184) and are not rerun. The run is descriptive: the
# validation gates computed by the reporting are not a Task 17 verdict.
schema_version: 1
experiment: mintmed_comparator_benchmark_mintmed
master_seed: 20260927
replicates: 500
bootstrap_replicates: 399
bootstrap_mode: standard
integration_draws: 256
integration_tolerance: 1.0e-3
max_seconds: 600
memory_budget_mb: 1024
cell_ids:
  - cell15_a_path_only_n250
  - cell16_b_path_only_n250
stress:
  enabled: false
  replicates: 1
  sample_size: 50
  fixture_names:
    - tied_score
    - sparse_events
    - missingness
    - opposing_paths
gates:
  continuous_abs_bias_sd: 0.05
  binary_abs_bias_probability: 0.02
  null_false_zero_wilson_upper: 0.10
  unavailable_or_fatal_max: 0.01
  coverage_family_alpha: 0.05
  coverage_nominal: 0.95
