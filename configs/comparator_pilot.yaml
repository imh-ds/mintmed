# Task 17 Stage 1 GitHub runtime pilot of the R comparators and the
# noise-floor rerun (T17-S7). Timing only, not evidence: it uses the
# pre-charter calibration seed 20260929, not the evaluation seed 20260927, so
# no evaluation dataset is analysed before the charter is frozen. Analysis
# settings are those of configs/mediation_validation_v3.yaml. Cells: the
# slowest expected cells of each tool (02 and 16 at N = 250 for both tools,
# 07 lavaan only, 09 and 11 mediate only, 10 both tools with two conditional
# calls per mode).
schema_version: 1
experiment: mintmed_comparator_runtime_pilot
master_seed: 20260929
replicates: 5
bootstrap_replicates: 399
bootstrap_mode: standard
integration_draws: 256
integration_tolerance: 1.0e-3
max_seconds: 600
memory_budget_mb: 1024
cell_ids:
  - cell02_linear_n250
  - cell07_serial_three_n200
  - cell09_spline_n250
  - cell10_moderated_n150
  - cell11_binary_mediator_n150
  - cell16_b_path_only_n250
stress:
  enabled: false
  replicates: 1
  sample_size: 50
  fixture_names:
    - tied_score
    - sparse_events
    - missingness
    - opposing_paths
gates:
  continuous_abs_bias_sd: 0.05
  binary_abs_bias_probability: 0.02
  null_false_zero_wilson_upper: 0.10
  unavailable_or_fatal_max: 0.01
  coverage_family_alpha: 0.05
  coverage_nominal: 0.95
