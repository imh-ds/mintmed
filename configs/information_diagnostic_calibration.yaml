# Task 18 Phase 1 (T18-S4): calibration-seed run of the information and
# conventional C2 diagnostics. Its only use is to match the warning thresholds
# (scripts/calibrate_diagnostic_thresholds.py) before the charter freezes.
# Calibration results are not evaluation evidence. Seed 20261001 is never
# reused for evaluation.
schema_version: 1
experiment: mintmed_information_diagnostic_calibration
purpose: threshold_calibration
master_seed: 20261001
replicates: 200
sample_sizes: [100, 250, 500]
mechanisms:
  - N1_linear
  - N2_curved_declared
  - N3_ties
  - N4_heavy_tail
  - A1_c_only
  - V1_outcome_variance
  - E1_omitted_quadratic
  - E2_omitted_interaction
  - E3_mediator_variance
information:
  permutations: 199
  k_cmi_fraction: 0.1
  k_perm: 5
  folds: 5
  residuals: cross_fitted
  sensitivities: true
  sensitivity_k_cmi_fraction: 0.2
conventional:
  alpha: 0.05
  spline_df: 3
